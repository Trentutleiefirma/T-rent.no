name: Check booking file replacements

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: |
          for file in Data_Trait.php Period_Trait.php functions.php Error_Trait.php RequestForQuote.php Email.php header.php tests/booking-check.php; do
            php -l "$file"
          done
      - name: Install Carbon for isolated booking checks
        run: composer require 'nesbot/carbon:^2' --no-interaction --no-progress --no-scripts
      - name: Exercise booking logic
        run: php tests/booking-check.php
      - name: Check JavaScript syntax
        run: node --check rnb-calendar.js
